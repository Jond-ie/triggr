name: Bug report
description: Something in Triggr doesn't work as expected, but nothing crashed.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. iPhone XR
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version and jailbreak
      placeholder: e.g. iOS 16.2, Dopamine 2.4 (Rootless)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Triggr version
      description: Shown in Sileo or Zebra under the package.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The steps that lead to it, plus the mode (Anywhere, Home Screen, In App, Lock Screen), the trigger and the actions.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other tweaks installed
      description: Anything else that uses buttons, gestures or the status bar that might be involved.
